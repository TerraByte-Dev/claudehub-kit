<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="ICM DOC — Interpretable Context Methodology">
  <title>ICM·DOC — Interpretable Context Methodology</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#12100B"/>
      <stop offset="55%"  stop-color="#0A0906"/>
      <stop offset="100%" stop-color="#070603"/>
    </linearGradient>

    <radialGradient id="bloom" cx="50%" cy="46%" r="62%">
      <stop offset="0%"   stop-color="#FFB000" stop-opacity="0.14"/>
      <stop offset="60%"  stop-color="#FFB000" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.30"/>
    </pattern>

    <filter id="phosphor" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="tight"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="wide"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screen">
      <rect x="10" y="10" width="1180" height="340" rx="20"/>
    </clipPath>
  </defs>

  <!-- CRT panel -->
  <rect x="10" y="10" width="1180" height="340" rx="20" fill="url(#panel)"/>
  <g clip-path="url(#screen)">
    <rect x="10" y="10" width="1180" height="340" fill="url(#bloom)"/>
    <rect x="10" y="10" width="1180" height="340" fill="url(#scan)"/>
  </g>
  <rect x="10.5" y="10.5" width="1179" height="339" rx="20" fill="none" stroke="#FFB000" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- prompt line -->
  <text x="600" y="98"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="27" letter-spacing="5" text-anchor="middle"
        textLength="470" lengthAdjust="spacingAndGlyphs"
        fill="#FFB000" fill-opacity="0.55">&gt;_ diagnose --structure</text>

  <!-- wordmark -->
  <g filter="url(#phosphor)">
    <text x="600" y="222"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
          font-size="116" font-weight="700" letter-spacing="14" text-anchor="middle"
          textLength="740" lengthAdjust="spacingAndGlyphs"
          fill="#FFC44D">ICM·DOC</text>
  </g>

  <!-- rule -->
  <rect x="330" y="256" width="540" height="1.5" fill="#FFB000" fill-opacity="0.35"/>

  <!-- subtitle -->
  <text x="600" y="304"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="24" letter-spacing="8" text-anchor="middle"
        textLength="700" lengthAdjust="spacingAndGlyphs"
        fill="#FFB000" fill-opacity="0.70">INTERPRETABLE CONTEXT METHODOLOGY</text>
</svg>
